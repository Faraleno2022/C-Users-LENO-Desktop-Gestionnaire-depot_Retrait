databases:
  - name: gestionnaire-db
    databaseName: gestionnaire
    plan: free

services:
  - type: web
    name: gestionnaire-sync
    runtime: python
    plan: free
    rootDir: server
    buildCommand: "bash build.sh"
    startCommand: "gunicorn core.wsgi:application"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestionnaire-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_DB_SSL
        value: "true"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.4"
