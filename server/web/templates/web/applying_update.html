<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMAB GROUP — Mise à jour</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background:#f3f4f6; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card-maj { background:#fff; border-radius:.75rem; padding:2.5rem; max-width:460px;
                box-shadow:0 6px 24px rgba(0,0,0,.08); text-align:center; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .sp { display:inline-block; animation: sp 1s linear infinite; font-size:2.6rem; color:#2563eb; }
  </style>
</head>
<body>
  <div class="card-maj">
    <div class="sp"><i class="bi bi-arrow-repeat"></i></div>
    <h1 class="h4 mt-3 mb-2">Mise à jour en cours…</h1>
    <p class="text-muted">
      La console s'installe et redémarre automatiquement. Patientez ~30 secondes.
      <br>Cette page se rechargera toute seule dès que c'est prêt.
    </p>
    <p class="small text-muted mb-0">Vos données sont conservées.</p>
  </div>
  <script>
    // Attend le redémarrage du serveur puis revient au tableau de bord.
    function retry() {
      fetch(location.origin + '/login/', { cache: 'no-store' })
        .then(function () { location.href = '/'; })
        .catch(function () { setTimeout(retry, 3000); });
    }
    setTimeout(retry, 20000);  // laisse le temps a l'installation de se faire
  </script>
</body>
</html>
